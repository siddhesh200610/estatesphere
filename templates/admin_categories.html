<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categories | EstateSphere</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head><body class="bg-light">
<nav class="navbar bg-white shadow-sm mb-4"><div class="container">
<a class="navbar-brand fw-bold text-primary" href="/">EstateSphere</a>
<div class="d-flex gap-2"><a class="btn btn-light btn-sm" href="/admin-dashboard">Dashboard</a><a class="btn btn-outline-danger btn-sm" href="/logout">Logout</a></div></div></nav>
<div class="container pb-5">
{% with messages = get_flashed_messages(with_categories=true) %}{% for cat, m in messages %}<div class="alert alert-{{ cat }}">{{ m }}</div>{% endfor %}{% endwith %}

<h4 class="fw-bold mb-3">Property Categories</h4>
<form method="POST" class="d-flex gap-2 mb-3" style="max-width:420px">
<input name="name" class="form-control" placeholder="New category (e.g. Farmhouse)" required><button class="btn btn-primary">Add</button></form>
<div class="card shadow-sm"><ul class="list-group list-group-flush">
{% for r in rows %}<li class="list-group-item d-flex justify-content-between align-items-center gap-2 flex-wrap">
<form method="POST" action="/admin/category/{{ r.id }}/rename" class="d-flex gap-2 flex-grow-1" style="max-width:420px"><input name="name" value="{{ r.name }}" class="form-control form-control-sm" required><button class="btn btn-sm btn-outline-primary">Rename</button></form>
<form method="POST" action="/admin/category/{{ r.id }}/delete" onsubmit="return confirm('Delete category?');"><button class="btn btn-sm btn-outline-danger">Delete</button></form></li>
{% endfor %}</ul></div>
</div></body></html>
