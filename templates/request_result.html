<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Status - EstateSphere</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f5f7fb;
            font-family: Arial, sans-serif;
        }

        .result-card {
            max-width: 650px;
            margin: 100px auto;
            background: white;
            border-radius: 18px;
            padding: 45px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .status-icon {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 38px;
            font-weight: bold;
        }

        .success-icon {
            background: #d1e7dd;
            color: #198754;
        }

        .error-icon {
            background: #f8d7da;
            color: #dc3545;
        }

        .property-name {
            font-weight: 600;
            color: #343a40;
            margin-top: 15px;
        }

        .btn-custom {
            margin-top: 25px;
            padding: 11px 25px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="result-card">

            {% if success %}

                <div class="status-icon success-icon">
                    ✓
                </div>

                <h2 class="text-success">
                    Request Submitted!
                </h2>

                <p class="text-muted mt-3">
                    {{ message }}
                </p>

            {% else %}

                <div class="status-icon error-icon">
                    !
                </div>

                <h2 class="text-danger">
                    Request Not Submitted
                </h2>

                <p class="text-muted mt-3">
                    {{ message }}
                </p>

            {% endif %}


            {% if property %}

                <div class="property-name">
                    {{ property.title }}
                </div>

            {% endif %}


            <div class="mt-3">

                <a
                    href="{{ url_for('property_details', property_id=property.id) }}"
                    class="btn btn-primary btn-custom"
                >
                    Back to Property
                </a>

                <a
                    href="{{ url_for('my_requests') }}"
                    class="btn btn-outline-secondary btn-custom ms-2"
                >
                    My Requests
                </a>

            </div>

        </div>

    </div>

</body>
</html>
