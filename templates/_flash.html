{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">
                    <span>{{ message }}</span>
                    <button
                        type="button"
                        class="flash-close"
                        onclick="this.parentElement.remove()"
                        aria-label="Close"
                    >
                        &times;
                    </button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}

<style>
    .flash-messages {
        max-width: 1100px;
        margin: 15px auto;
        padding: 0 15px;
    }

    .flash-messages .alert {
        padding: 12px 16px;
        margin-bottom: 10px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 14px;
    }

    .alert-success {
        background: #d1e7dd;
        color: #0f5132;
    }

    .alert-danger,
    .alert-error {
        background: #f8d7da;
        color: #842029;
    }

    .alert-warning {
        background: #fff3cd;
        color: #664d03;
    }

    .alert-info,
    .alert-message {
        background: #cff4fc;
        color: #055160;
    }

    .flash-close {
        border: none;
        background: transparent;
        color: inherit;
        font-size: 22px;
        cursor: pointer;
        line-height: 1;
    }
</style>
