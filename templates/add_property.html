<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Property - EstateSphere</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-buildings me-2"></i>
            EstateSphere
        </a>

        <a href="/" class="btn btn-outline-primary">
            <i class="bi bi-house me-1"></i>
            Home
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card border-0 shadow rounded-4">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Add Your Property</h2>
                        <p class="text-muted">
                            List your property on EstateSphere
                        </p>
                    </div>

                    <!-- multipart/form-data जोड़ा गया है फाइल अपलोड के लिए -->
                    <form method="POST" action="/add-property" enctype="multipart/form-data">

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Property Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                placeholder="e.g. 2 BHK Premium Apartment"
                                required
                            >
                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">
                                    Property Type
                                </label>

                                <select
                                    name="property_type"
                                    class="form-select"
                                    required
                                >
                                    <option value="">Select Type</option>
                                    <option value="Apartment">Apartment</option>
                                    <option value="House">House</option>
                                    <option value="Villa">Villa</option>
                                    <option value="Plot">Plot</option>
                                    <option value="Commercial">Commercial</option>
                                </select>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">
                                    Listing Type
                                </label>

                                <select
                                    name="listing_type"
                                    class="form-select"
                                    required
                                >
                                    <option value="">Select</option>
                                    <option value="buy">For Buy</option>
                                    <option value="rent">For Rent</option>
                                    <option value="sell">For Sale</option>
                                </select>
                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">
                                    Price
                                </label>

                                <input
                                    type="number"
                                    name="price"
                                    class="form-control"
                                    placeholder="Enter price"
                                    min="1"
                                    required
                                >
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">
                                    Area (sq. ft.)
                                </label>

                                <input
                                    type="number"
                                    name="area"
                                    class="form-control"
                                    placeholder="e.g. 1200"
                                    min="1"
                                    required
                                >
                            </div>

                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Location
                            </label>

                            <input
                                type="text"
                                name="location"
                                class="form-control"
                                placeholder="e.g. Pune, Maharashtra"
                                required
                            >
                        </div>

                        <!-- Multiple Image File Upload Field -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Upload Property Images
                            </label>

                            <input
                                type="file"
                                name="images"
                                class="form-control"
                                accept="image/*"
                                multiple
                            >
                            <small class="text-muted">
                                आप एक साथ कई फोटो (Ctrl/Cmd दबाकर) चुन सकते हैं।
                            </small>
                        </div>

                        <!-- Optional URL Field (Fallback) -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Property Image URL (Optional)
                            </label>

                            <input
                                type="url"
                                name="image"
                                class="form-control"
                                placeholder="https://example.com/property.jpg (अगर फाइल अपलोड नहीं कर रहे हैं)"
                            >
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">
                                Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="5"
                                placeholder="Describe your property..."
                            ></textarea>
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100"
                        >
                            <i class="bi bi-plus-circle me-2"></i>
                            Add Property
                        </button>

                    </form>

                    <div class="text-center mt-4">
                        <a href="/" class="text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i>
                            Back to Home
                        </a>
                    </div>

                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>
